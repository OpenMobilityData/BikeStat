[package]
name = "bikestat"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Local-only testing mode: bypass MONTREAL_LOCATION_FILTER and load the
# full unfiltered VdM CSV from `data/cyclistes-all.csv`.  Enable with
# `trunk serve --features unfiltered`.  Never enabled in production builds.
unfiltered = []

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_meta = { version = "0.7" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Navigator",
    "Storage",
    "Document",
    "Element",
    "DomRect",
    "MouseEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "HtmlImageElement",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "console",
    "Performance",
    "XmlSerializer",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlElement",
    "SvgElement",
    "SvgsvgElement",
    "Clipboard",
    "ClipboardItem",
] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
gloo-net = { version = "0.6", features = ["http"] }
futures = "0.3"
console_error_panic_hook = "0.1"
calamine = { version = "0.26", features = ["dates"] }
chrono-tz = "0.10"

[profile.release]
opt-level = "z"
lto = true
